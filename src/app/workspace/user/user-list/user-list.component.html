<div class="card">
  <div class="flex justify-between mb-4">
    <h2>Employee</h2>

    <p-button
      label="Add Employee"
      severity="success"
      icon="pi pi-plus"
      routerLink="/user/add"
    />
  </div>


    <p-table
      [value]="userList"
      [paginator]="true"
      [rows]="pageSize"
      [first]="first"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [lazy]="true"
      (onLazyLoad)="onDataChange($event)"
      [tableStyle]="{ 'min-width': '70rem' }"
    >
      <ng-template #header>
        <tr>
          <th>SL</th>
          <th>Name</th>
          <th>Company</th>
          <th>Employee ID</th>
          <th>Designation</th>
          <th>Department</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </ng-template>

      <ng-template #body let-emp let-i="rowIndex">
        <tr>
          <td>{{ first + i + 1 }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.company }}</td>
          <td>{{ emp.employeeId }}</td>
          <td>{{ emp.designation }}</td>
          <td>{{ emp.department }}</td>
          <td>{{ emp.phone }}</td>
          <td>{{ emp.email }}</td>
          <td>
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              (click)="updateEmployee(emp)"
            />
            <p-button
              icon="pi pi-times"
              [rounded]="true"
              [text]="true"
              severity="danger"
              (click)="removeEmployee(emp._id, $event)"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>


  <p-toast />
  <p-confirm-popup />
</div>
