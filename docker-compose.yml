version: '3.8'

services:
  ecom-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom-admin-panel
    ports:
      - "4401:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

